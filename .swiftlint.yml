


included:

  - PFI

  - PFITests

  - PFIUITests



opt_in_rules:

  - force_unwrapping

  - implicitly_unwrapped_optional

  - empty_count

  - first_where

  - last_where

  - toggle_bool



disabled_rules:

  - type_body_length

  - todo

  # Правило старше Swift 5.3: с тех пор несколько trailing-замыканий — штатный синтаксис.
  # Мешает идиоматичному Button { action } label: { view } и .overlay { } .background { }.
  - multiple_closures_with_trailing_closure



line_length:

  warning: 120

  error: 160

  ignores_comments: true

  ignores_urls: true



identifier_name:

  min_length: 2

  excluded: [id, x, y, to, up]



function_body_length:

  warning: 60



file_length:

  warning: 400



# Список терминов задан заново, без «master»: у нас «mastered» — про освоение материала
# (SM-2), к терминологии master/slave отношения не имеет. Имя закреплено в Asset Catalog
# (Status colors) и дальше уйдёт в модель данных. Опции allowed_terms в правиле нет —
# единственный способ снять один термин — перечислить остальные через override_terms.
inclusive_language:

  override_terms:

    - slave

    - blacklist

    - whitelist

